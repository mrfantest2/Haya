name: Windows v3.0 functional smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-functional:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Static v3 guards
        shell: pwsh
        run: |
          $src = Get-Content manager/main.go -Raw
          if ($src -notmatch 'CompareAndSwap\(false, true\)') { throw 'Install single-flight guard missing' }
          $all = (Get-Content manager/*.go -Raw) -join "`n"
          if ($all -match 'docker\.exe|wsl\.exe|runas') { throw 'Legacy prerequisite path returned to active v3 manager' }
          if ($all -notmatch 'CryptProtectData') { throw 'DPAPI protection path missing' }
      - name: Build byte-identical Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/Haya_Job_Autopilot_v3.0.0_No_Docker.exe ./manager
          $actual=(Get-FileHash dist/Haya_Job_Autopilot_v3.0.0_No_Docker.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='a7c1389411fec97cdf7c92f3a4ea104f52d73abb9c97b071c01ff36c326a62c5'
          if($actual -ne $expected){ throw "Release checksum mismatch: $actual" }
          "$actual  Haya_Job_Autopilot_v3.0.0_No_Docker.exe" | Set-Content dist/SHA256-v3.0.0.txt
      - name: Runtime smoke - hidden agent and local dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $appData=Join-Path $env:LOCALAPPDATA 'HayaJobAutopilot'
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path 'dist/Haya_Job_Autopilot_v3.0.0_No_Docker.exe').Path
          $agent=Start-Process -FilePath $exe -ArgumentList '--agent' -PassThru
          try {
            $health=$null
            for($i=0;$i -lt 30;$i++){
              Start-Sleep -Milliseconds 500
              try {
                $health=Invoke-RestMethod -Uri 'http://127.0.0.1:8787/healthz' -TimeoutSec 2
                if($health.ok){ break }
              } catch {}
            }
            if(-not $health -or -not $health.ok){ throw 'Agent dashboard health endpoint did not become ready' }
            if($health.version -ne '3.0.0'){ throw "Unexpected agent version: $($health.version)" }
            $status=Invoke-RestMethod -Uri 'http://127.0.0.1:8787/api/status' -TimeoutSec 3
            if(-not $status.ok){ throw 'Status endpoint did not report ok=true' }
            if($status.version -ne '3.0.0'){ throw 'Status endpoint version mismatch' }
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8787/api/run' -Method POST -ContentType 'application/json' -Body '{}' -TimeoutSec 10 | Out-Null
              throw 'Manual run should be safely blocked until Yahoo app password is configured'
            } catch {
              if($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -ne 409){ throw }
            }
            Invoke-RestMethod -Uri 'http://127.0.0.1:8787/api/shutdown' -Method POST -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null
            for($i=0;$i -lt 20 -and -not $agent.HasExited;$i++){ Start-Sleep -Milliseconds 250; $agent.Refresh() }
            if(-not $agent.HasExited){ throw 'Agent did not shut down cleanly' }
          } finally {
            if(-not $agent.HasExited){ Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Runtime smoke - GUI process remains responsive/alive
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/Haya_Job_Autopilot_v3.0.0_No_Docker.exe').Path
          $gui=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          $gui.Refresh()
          if($gui.HasExited){ throw "GUI exited unexpectedly with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Haya-Job-Autopilot-v3.0.0-windows-functional
          path: |
            dist/Haya_Job_Autopilot_v3.0.0_No_Docker.exe
            dist/SHA256-v3.0.0.txt
          if-no-files-found: error
