name: Windows v3 smoke build

on:
  push:
    branches: [main]
    paths:
      - 'source-v3/**'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify and extract authoritative source
        shell: pwsh
        run: |
          $expected = (Get-Content source-v3/SHA256.txt).Split(' ')[0].Trim()
          $actual = (Get-FileHash source-v3/Haya_Job_Autopilot_v3.0.0_Source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source archive checksum mismatch" }
          Remove-Item .v3src -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive source-v3/Haya_Job_Autopilot_v3.0.0_Source.zip .v3src
      - name: Static v3 smoke assertions
        shell: pwsh
        run: |
          $src = Get-Content .v3src/manager/main.go -Raw
          if ($src -notmatch 'CompareAndSwap\(false, true\)') { throw 'Install single-flight guard missing' }
          $all = Get-Content .v3src/manager/*.go -Raw
          if ($all -match 'docker\.exe|wsl\.exe|runas') { throw 'Legacy prerequisite path returned to active v3 manager' }
      - name: Build native Windows GUI
        shell: pwsh
        working-directory: .v3src
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../Haya_Job_Autopilot_Manager_v3.0.0.exe ./manager
          Get-FileHash ../Haya_Job_Autopilot_Manager_v3.0.0.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Haya-Job-Autopilot-v3.0.0-windows
          path: Haya_Job_Autopilot_Manager_v3.0.0.exe
