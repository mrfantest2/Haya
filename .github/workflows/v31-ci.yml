name: v3.1 development validation

on:
  push:
    branches: [v3.1-dev, v3.1-webview-staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-functional:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CANDIDATE_EXE: Haya_Job_Autopilot_v3.1.0_DEV.exe
      WEBVIEW2_COMMIT: 56598839c808a2340edee99204db479f410e9bf4
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact v3.1 base source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='source-v3.1\webview2-parts'
          $names=@('part00','part01','part02','part03','part04','fix05-0','fix05-1','fix05-2','fix05-3','fix05-4','fix05-5','fix05-6','part05b','part06','part07a','part07b','part08','part09','part10','part11','part12','part13')
          foreach($name in $names){if(-not (Test-Path (Join-Path $root $name))){throw "Missing verified source piece $name"}}
          $base64=($names | ForEach-Object { (Get-Content (Join-Path $root $_) -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v31-source.zip',[Convert]::FromBase64String($base64))
          $actual=(Get-FileHash 'v31-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='866fa7fea338ba578e5d3acceed2e705c810c3fb9e252fc5e220309e168a504b'
          if($actual -ne $expected){throw "v3.1 base source checksum mismatch: $actual"}
          Remove-Item '.v31src' -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath 'v31-source.zip' -DestinationPath '.v31src' -Force

      - name: Apply reviewed direct WebView2 shell patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item '.v31src\manager\shell_wails.go' -Force -ErrorAction SilentlyContinue
          Remove-Item '.v31src\manager\wails.json' -Force -ErrorAction SilentlyContinue
          @'
          //go:build !webview2

          package main

          func runAppLauncher() error {
              return runBrowserAppLauncher()
          }
          '@ | Set-Content '.v31src\manager\shell_edge.go' -Encoding utf8NoBOM
          @'
          //go:build webview2

          package main

          import (
              "os"
              "path/filepath"
              "strings"
              "time"
              "unsafe"

              webview2 "github.com/jchv/go-webview2"
          )

          var (
              pFindWindowWeb    = u32.NewProc("FindWindowW")
              pSetForegroundWeb = u32.NewProc("SetForegroundWindow")
              pIsIconicWeb      = u32.NewProc("IsIconic")
          )

          const swRestore = 9

          func focusExistingAppWindow() bool {
              hwnd, _, _ := pFindWindowWeb.Call(0, uintptr(unsafe.Pointer(utf16Ptr(appTitle))))
              if hwnd == 0 {
                  return false
              }
              iconic, _, _ := pIsIconicWeb.Call(hwnd)
              if iconic != 0 {
                  pShowWindow.Call(hwnd, swRestore)
              } else {
                  pShowWindow.Call(hwnd, SW_SHOW)
              }
              pSetForegroundWeb.Call(hwnd)
              return true
          }

          func runAppLauncher() error {
              mutex, already, err := createNamedMutex("Local\\HayaJobAutopilotWebView31")
              if err != nil {
                  return err
              }
              defer closeHandle(mutex)
              if already {
                  focusExistingAppWindow()
                  return nil
              }
              if err := ensureInstalledRuntime(); err != nil {
                  return err
              }

              current, _ := os.Executable()
              current, _ = filepath.Abs(current)
              installed, _ := filepath.Abs(installedExePath())
              if !strings.EqualFold(filepath.Clean(current), filepath.Clean(installed)) {
                  if err := installLocal(); err != nil {
                      return err
                  }
                  createDesktopShortcutBestEffort()
              } else if status, _ := probeLocalAgent(); !strings.HasPrefix(status, "Running") {
                  if err := startAgentWithWait(); err != nil {
                      return err
                  }
              }
              if err := waitForAgent(10 * time.Second); err != nil {
                  return err
              }

              dataPath := filepath.Join(appDir(), "webview2")
              if err := os.MkdirAll(dataPath, 0700); err != nil {
                  return err
              }
              w := webview2.NewWithOptions(webview2.WebViewOptions{
                  Debug: false,
                  AutoFocus: true,
                  DataPath: dataPath,
                  WindowOptions: webview2.WindowOptions{
                      Title: appTitle,
                      Width: 1180,
                      Height: 780,
                      Center: true,
                  },
              })
              if w == nil {
                  appendLog("WebView2 unavailable; opened browser fallback", map[string]any{"version": appVersion})
                  openTarget("http://127.0.0.1:8787")
                  return nil
              }
              defer w.Destroy()
              w.SetSize(900, 620, webview2.HintMin)
              w.Navigate("http://127.0.0.1:8787/")
              w.Run()
              return nil
          }
          '@ | Set-Content '.v31src\manager\shell_webview2.go' -Encoding utf8NoBOM
          Push-Location .v31src
          try { gofmt -w manager\shell_edge.go manager\shell_webview2.go } finally { Pop-Location }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Static safety and UX guards
        working-directory: .v31src
        shell: pwsh
        run: |
          $all=(Get-Content manager/*.go -Raw) -join "`n"
          if($all -match 'docker\.exe|wsl\.exe|runas'){ throw 'Legacy prerequisite path returned' }
          if($all -notmatch 'CryptProtectData'){ throw 'DPAPI protection missing' }
          if($all -notmatch 'canonicalizeJobURL'){ throw 'Canonical dedupe missing' }
          if($all -notmatch 'HayaJobAutopilotWebView31'){ throw 'Direct WebView single-instance guard missing' }
          if($all -notmatch 'github.com/jchv/go-webview2'){ throw 'Direct WebView2 binding missing' }
          if($all -notmatch 'Yahoo app password is optional'){ throw 'Optional Yahoo behavior guard missing' }
          if($all -match 'Work authorization answer missing'){ throw 'Work authorization still incorrectly blocks runtime' }
          node --check manager/resources/app.js

      - name: Unit tests
        working-directory: .v31src
        shell: pwsh
        run: go test ./manager -run 'TestCanonicalizeJobURL|TestJobFingerprint' -v

      - name: Vet and build dependency-free repair fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Push-Location .v31src
          try {
            go vet -unsafeptr=false ./manager
            go build -buildvcs=false -trimpath -ldflags "-H=windowsgui -s -w" -o ../dist/Haya_Job_Autopilot_v3.1.0_FALLBACK.exe ./manager
          } finally { Pop-Location }

      - name: Pin direct pure-Go WebView2 binding
        working-directory: .v31src
        shell: pwsh
        run: |
          go get "github.com/jchv/go-webview2@$env:WEBVIEW2_COMMIT"
          go mod tidy
          go list -m github.com/jchv/go-webview2

      - name: Vet and build direct WebView2 candidate
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .v31src
          try {
            go vet -tags=webview2 -unsafeptr=false ./manager
            go build -buildvcs=false -trimpath -tags=webview2 -ldflags "-H=windowsgui -s -w" -o "../dist/$env:CANDIDATE_EXE" ./manager
          } finally { Pop-Location }
          if(-not (Test-Path (Join-Path 'dist' $env:CANDIDATE_EXE))){throw 'Direct WebView2 output missing'}
          (Get-FileHash (Join-Path 'dist' $env:CANDIDATE_EXE) -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content dist/SHA256-v3.1.0-dev.txt

      - name: Runtime smoke - agent, optional setup and local API
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $appData=Join-Path $env:LOCALAPPDATA 'HayaJobAutopilot'
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path (Join-Path 'dist' $env:CANDIDATE_EXE)).Path
          $agent=Start-Process -FilePath $exe -ArgumentList '--agent' -PassThru
          try {
            $health=$null
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 500
              try{$health=Invoke-RestMethod 'http://127.0.0.1:8787/healthz' -TimeoutSec 2;if($health.ok){break}}catch{}
            }
            if(-not $health -or -not $health.ok){throw 'Agent health endpoint did not start'}
            if($health.version -ne '3.1.0-dev'){throw "Unexpected version $($health.version)"}
            $status=Invoke-RestMethod 'http://127.0.0.1:8787/api/status' -TimeoutSec 3
            if($status.setupReady -ne $true){throw 'Fresh install should be core-ready without optional Yahoo/legal answers'}
            if($status.yahooConfigured -ne $false){throw 'Fresh install unexpectedly has Yahoo configured'}
            $cfg=Invoke-RestMethod 'http://127.0.0.1:8787/api/config' -TimeoutSec 3
            if($cfg.yahooConfigured -ne $false){throw 'Config leaked unexpected Yahoo state'}
            $cv=Invoke-RestMethod 'http://127.0.0.1:8787/api/cv' -TimeoutSec 3
            if(-not $cv.present){throw 'Embedded CV missing'}
            $html=(Invoke-WebRequest 'http://127.0.0.1:8787/' -TimeoutSec 3).Content
            if($html -notmatch 'Profile &amp; CV|Profile & CV'){throw 'Simplified web UI not served'}
            if($html -notmatch 'JOB DISCOVERY · OPTIONAL'){throw 'Yahoo optional wording missing'}
            $mail=Invoke-WebRequest 'http://127.0.0.1:8787/api/test-mail' -Method POST -ContentType 'application/json' -Body '{}' -SkipHttpErrorCheck -TimeoutSec 5
            if([int]$mail.StatusCode -ne 409){throw "Explicit Yahoo test should require a credential; got $([int]$mail.StatusCode)"}
            $run=Invoke-RestMethod 'http://127.0.0.1:8787/api/run' -Method POST -ContentType 'application/json' -Body '{}' -TimeoutSec 5
            if(-not $run.ok -or -not $run.skippedMailbox){throw 'Manual-only run should succeed and skip Yahoo mailbox'}
            $body=@{workAuthorizationHungary='';sponsorshipRequired='';earliestStartDate='';minimumGrossMonthlyHUF='';dailyApplicationLimit=5;automationMode='Prepare & Ask';minimumMatchScore=80;maximumFraudRisk=20}|ConvertTo-Json
            $saved=Invoke-RestMethod 'http://127.0.0.1:8787/api/config' -Method POST -ContentType 'application/json' -Body $body -TimeoutSec 5
            if(-not $saved.ok){throw 'Optional blank application answers failed to save'}
            Invoke-RestMethod 'http://127.0.0.1:8787/api/shutdown' -Method POST -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null
            for($i=0;$i -lt 30 -and -not $agent.HasExited;$i++){Start-Sleep -Milliseconds 250;$agent.Refresh()}
            if(-not $agent.HasExited){throw 'Agent did not shut down cleanly'}
          } finally {
            $agent.Refresh()
            if(-not $agent.HasExited){Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Runtime smoke - direct WebView2 one-click UI and single instance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $appData=Join-Path $env:LOCALAPPDATA 'HayaJobAutopilot'
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path (Join-Path 'dist' $env:CANDIDATE_EXE)).Path
          $ui=Start-Process -FilePath $exe -PassThru
          try {
            $health=$null
            for($i=0;$i -lt 50;$i++){
              Start-Sleep -Milliseconds 400
              $ui.Refresh()
              if($ui.HasExited){throw "WebView2 process exited early with code $($ui.ExitCode)"}
              try{$health=Invoke-RestMethod 'http://127.0.0.1:8787/healthz' -TimeoutSec 2;if($health.ok){break}}catch{}
            }
            if(-not $health -or -not $health.ok){throw 'One-click WebView2 launcher did not leave agent online'}
            $installed=Join-Path $appData 'Haya Job Autopilot.exe'
            if(-not (Test-Path $installed)){throw 'Installed EXE missing after one-click launch'}
            Start-Sleep -Seconds 3
            $ui.Refresh()
            if($ui.HasExited){throw 'Direct WebView2 UI did not remain alive'}
            $second=Start-Process -FilePath $installed -PassThru
            for($i=0;$i -lt 30 -and -not $second.HasExited;$i++){Start-Sleep -Milliseconds 200;$second.Refresh()}
            if(-not $second.HasExited){Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue;throw 'Second UI instance was not suppressed'}
            $ui.Refresh()
            if($ui.HasExited){throw 'Primary UI exited after second-instance launch'}
          } finally {
            if($ui -and -not $ui.HasExited){Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue}
            try{Invoke-RestMethod 'http://127.0.0.1:8787/api/shutdown' -Method POST -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null}catch{}
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Haya-Job-Autopilot-v3.1.0-dev-Direct-WebView2
          path: |
            dist/Haya_Job_Autopilot_v3.1.0_DEV.exe
            dist/SHA256-v3.1.0-dev.txt
          if-no-files-found: error
