name: Temporary LocalWhisper v0.2.1 Resume Build

on:
  push:
    branches:
      - build/localwhisper-v0.2.1-resume
    paths:
      - localwhisper-v0.2.1-build.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.2.0 source and apply v0.2.1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'cde02db596fa6e673d56c2a87b232cb9a1d8a7b34c80cd4055bd966e78efffae  localwhisper-v0.2.0.ci.part01.b64' | sha256sum -c -
          echo '2a3d257f93bb856630ea95dacb1e9cd88a23876d01c2d1c8e4c9dbc65a0e3c44  localwhisper-v0.2.0.ci.part02.b64' | sha256sum -c -
          echo 'a85f2d3aec058cec0de969e4a8234c90852278969431d1d34e0e45cd7fac89b5  localwhisper-v0.2.0.ci.part03a.b64' | sha256sum -c -
          echo '5f42f6c6d6cce073bbaabf609f270772d2c8cfac7d2cc8b094ce6cb830e0f630  localwhisper-v0.2.0.ci.part03b.b64' | sha256sum -c -
          echo 'f85b559f63f06b7f8a3918a6ff805d7fe803d347ef8836253ac2193bab0a8a50  localwhisper-v0.2.0.ci.part04.b64' | sha256sum -c -
          cat localwhisper-v0.2.0.ci.part01.b64 \
              localwhisper-v0.2.0.ci.part02.b64 \
              localwhisper-v0.2.0.ci.part03a.b64 \
              localwhisper-v0.2.0.ci.part03b.b64 \
              localwhisper-v0.2.0.ci.part04.b64 > /tmp/localwhisper-v0.2.0-ci.tar.xz.b64
          base64 --decode /tmp/localwhisper-v0.2.0-ci.tar.xz.b64 > /tmp/localwhisper-v0.2.0-ci.tar.xz
          echo '93e33ec5a9f6b0306467a1670ccd008dcf4d47c7b5cff53ed53a4848924ff2e1  /tmp/localwhisper-v0.2.0-ci.tar.xz' | sha256sum -c -
          PROJECT="$RUNNER_TEMP/LocalWhisper"
          mkdir -p "$PROJECT"
          tar -xJf /tmp/localwhisper-v0.2.0-ci.tar.xz -C "$PROJECT"
          grep -Fq 'versionName = "0.2.0"' "$PROJECT/app/build.gradle.kts"

          echo '6f0e802c321e88df998572b35abf83bd109696411e745a85a52809850545c69c  localwhisper-v0.2.1.patch.part00.b64' | sha256sum -c -
          echo '1692a839f36474702227969ea8702d0958085ab29867effa2c2305a2ddcff026  localwhisper-v0.2.1.patch.part01a.b64' | sha256sum -c -
          echo '834f421329e8d36bb8b7593fd11ef54c89489be0e708e02957b403ba0a958e26  localwhisper-v0.2.1.patch.part01b.b64' | sha256sum -c -
          echo 'b88aad6c487735ff3133e22e3722f1c58e7443d1d58c59c2fa18f4ca9542b170  localwhisper-v0.2.1.patch.part02a.b64' | sha256sum -c -
          echo '3fbbf0dab62e9fa5c310fe26c7425e4b9b61a7ace90f778de96dd019c826e0f4  localwhisper-v0.2.1.patch.part02b.b64' | sha256sum -c -
          echo '5f56ce246229c59f49db357966c4ca682b60460b9d1b233c45fb97587f46624c  localwhisper-v0.2.1.patch.part03.b64' | sha256sum -c -
          cat localwhisper-v0.2.1.patch.part00.b64 \
              localwhisper-v0.2.1.patch.part01a.b64 \
              localwhisper-v0.2.1.patch.part01b.b64 \
              localwhisper-v0.2.1.patch.part02a.b64 \
              localwhisper-v0.2.1.patch.part02b.b64 \
              localwhisper-v0.2.1.patch.part03.b64 > /tmp/localwhisper-v0.2.1.patch.gz.b64
          echo '471ca808e2fbc3f1105a9deffdf4624a0188d56b4f4fbb1a8c0eec7b830ae465  /tmp/localwhisper-v0.2.1.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/localwhisper-v0.2.1.patch.gz.b64 > /tmp/localwhisper-v0.2.1.patch.gz
          gzip -dc /tmp/localwhisper-v0.2.1.patch.gz > /tmp/localwhisper-v0.2.1.patch
          echo 'e0d66b685580fc5dfba94505723f193cc9fdca06d212586fd1878729dce41063  /tmp/localwhisper-v0.2.1.patch' | sha256sum -c -
          cd "$PROJECT"
          patch -p1 --forward < /tmp/localwhisper-v0.2.1.patch
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify staged v0.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT/app/src/main/java/win/fantest/localwhisper/ResumableHttpDownloader.java"
          test -f "$PROJECT/app/src/main/java/win/fantest/localwhisper/ModelFileInstaller.java"
          test -f "$PROJECT/app/src/main/java/win/fantest/localwhisper/ModelDownloadService.java"
          test -f "$PROJECT/app/src/main/java/win/fantest/localwhisper/ModelDownloadStateStore.java"
          test -f "$PROJECT/tools/v021_contract_test.py"
          grep -Fq 'versionCode = 5' "$PROJECT/app/build.gradle.kts"
          grep -Fq 'versionName = "0.2.1"' "$PROJECT/app/build.gradle.kts"
          grep -Fq 'Loading Whisper model' "$PROJECT/app/src/main/java/win/fantest/localwhisper/TranscriptionService.java"
          grep -Fq 'Decoding voice note' "$PROJECT/app/src/main/java/win/fantest/localwhisper/TranscriptionService.java"
          grep -Fq 'Preparing transcription' "$PROJECT/app/src/main/java/win/fantest/localwhisper/TranscriptionService.java"
          grep -Fq '#25D366' "$PROJECT/app/src/main/res/values/colors.xml"
          ! grep -Fq 'android.app.DownloadManager' "$PROJECT/app/src/main/java/win/fantest/localwhisper/MainActivity.java"
          ! grep -Fq 'android.app.DownloadManager' "$PROJECT/app/src/main/java/win/fantest/localwhisper/ModelManager.java"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Pin NDK for hosted build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT']) / 'app/build.gradle.kts'
          s = p.read_text()
          needle = '    compileSdk = 35\n'
          assert needle in s
          if 'ndkVersion = ' not in s:
              s = s.replace(needle, needle + '    ndkVersion = "27.2.12479018"\n', 1)
          p.write_text(s)
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          rm -rf /tmp/lw-tests
          mkdir -p /tmp/lw-tests
          javac -d /tmp/lw-tests \
            app/src/main/java/win/fantest/localwhisper/Resampler.java \
            app/src/main/java/win/fantest/localwhisper/DownloadProgressEstimator.java \
            app/src/main/java/win/fantest/localwhisper/ProgressMapper.java \
            app/src/main/java/win/fantest/localwhisper/ResumableHttpDownloader.java \
            app/src/main/java/win/fantest/localwhisper/ModelFileInstaller.java \
            tools/ResamplerSmokeTest.java \
            tools/DownloadProgressEstimatorTest.java \
            tools/ProgressMapperTest.java \
            tools/ResumableHttpDownloaderTest.java \
            tools/ModelFileInstallerTest.java
          java -cp /tmp/lw-tests ResamplerSmokeTest
          java -cp /tmp/lw-tests DownloadProgressEstimatorTest
          java -cp /tmp/lw-tests ProgressMapperTest
          java -cp /tmp/lw-tests ResumableHttpDownloaderTest
          java -cp /tmp/lw-tests ModelFileInstallerTest
          python3 tools/source_contract_test.py
          python3 tools/main_ui_contract_test.py
          python3 tools/v021_contract_test.py

      - name: Build unsigned arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Align and verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          mkdir -p artifacts
          OUT="artifacts/LocalWhisper-v0.2.1-unsigned-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$OUT" >/dev/null
          unzip -t "$OUT" >/dev/null
          unzip -l "$OUT" | grep -Fq 'lib/arm64-v8a/liblocalwhisper.so'
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          sha256sum "$OUT" | tee artifacts/UNSIGNED_SHA256SUMS.txt

      - name: Upload unsigned APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: LocalWhisper-v0.2.1-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 2
