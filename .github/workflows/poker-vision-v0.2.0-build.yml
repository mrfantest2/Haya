name: Poker Vision v0.2.11 Finalization Contract

on:
  push:
    branches: [poker-vision-v0.2.11-final]
    paths:
      - 'poker-trainer-ci/**'
      - '.github/workflows/poker-vision-v0.2.0-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify final source is self-contained
        working-directory: poker-trainer-ci
        run: python3 tools/verify_final_source.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        working-directory: poker-trainer-ci
        run: gradle --no-daemon testDebugUnitTest --stacktrace
