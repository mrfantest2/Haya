name: Poker Vision v0.3.0 Multi-Card Scanner

on:
  push:
    branches: [feature/poker-vision-v0.3.0-multicard-scanner]
    paths:
      - 'poker-trainer-ci/**'
      - '.github/workflows/poker-vision-v0.2.0-build.yml'
  pull_request:
    branches: [plan/poker-vision-v0.3.0-multicard-scanner]
    paths:
      - 'poker-trainer-ci/**'
      - '.github/workflows/poker-vision-v0.2.0-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        working-directory: poker-trainer-ci
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Verify v0.3.0 source contract
        working-directory: poker-trainer-ci
        run: |
          set -euo pipefail
          python3 tools/verify_final_source.py
          grep -F "versionCode 14" app/build.gradle
          grep -F "versionName '0.3.0'" app/build.gradle
          grep -F "implementation 'org.opencv:opencv:4.14.0'" app/build.gradle
          grep -F 'opponents > 9' app/src/main/java/com/fantest/pokervision/PokerMath.java

      - name: Build QA APK and unsigned Play bundle
        working-directory: poker-trainer-ci
        run: gradle --no-daemon assembleDebug bundleRelease --stacktrace

      - name: Verify stable QA signature and package
        run: |
          set -euo pipefail
          APK='poker-trainer-ci/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fqi '1dc111849c13619ff7ea0659e293b9079935fba071835682357fd84117b60710' /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.fantest.pokervision.qa'" /tmp/badging.txt
          grep -Fq "versionCode='14'" /tmp/badging.txt
          grep -Fq "versionName='0.3.0-qa'" /tmp/badging.txt
          grep -Fq "application-label:'Poker Vision QA'" /tmp/badging.txt

      - name: Stage build output
        run: |
          set -euo pipefail
          mkdir -p poker-vision-build
          cp poker-trainer-ci/app/build/outputs/apk/debug/app-debug.apk poker-vision-build/Poker-Vision-v0.3.0-QA.apk
          cp poker-trainer-ci/app/build/outputs/bundle/release/app-release.aab poker-vision-build/Poker-Vision-v0.3.0-unsigned.aab

      - name: Upload gated build input
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Vision-v0.3.0-build-input
          path: poker-vision-build/*
          if-no-files-found: error
          retention-days: 7

  vision-fixtures:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: OpenCV geometry and recognition fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd poker-trainer-ci && gradle --no-daemon connectedDebugAndroidTest --stacktrace

  package:
    needs: [build, vision-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download gated build
        uses: actions/download-artifact@v4
        with:
          name: Poker-Vision-v0.3.0-build-input
          path: poker-vision-dist

      - name: Validate final artifacts
        run: |
          set -euo pipefail
          test "$(stat -c%s poker-vision-dist/Poker-Vision-v0.3.0-QA.apk)" -gt 100000
          test "$(stat -c%s poker-vision-dist/Poker-Vision-v0.3.0-unsigned.aab)" -gt 100000
          unzip -t poker-vision-dist/Poker-Vision-v0.3.0-QA.apk >/dev/null
          unzip -t poker-vision-dist/Poker-Vision-v0.3.0-unsigned.aab >/dev/null
          (cd poker-vision-dist && sha256sum Poker-Vision-v0.3.0-QA.apk Poker-Vision-v0.3.0-unsigned.aab > SHA256SUMS.txt)
          cat poker-vision-dist/SHA256SUMS.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Vision-v0.3.0-multicard-scanner
          path: poker-vision-dist/*
          if-no-files-found: error
          retention-days: 30
