name: Poker Vision v0.2.0 APK

on:
  push:
    branches: [poker-vision-v0.2.0]
    paths:
      - 'poker-vision-source-parts/**'
      - '.github/workflows/poker-vision-v0.2.0-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat poker-vision-source-parts/part-*.b64 | base64 --decode > Poker-Vision-v0.2.0-source.zip
          unzip -t Poker-Vision-v0.2.0-source.zip
          mkdir PokerVision
          unzip -q Poker-Vision-v0.2.0-source.zip -d PokerVision
          test -f PokerVision/settings.gradle.kts
          test -f PokerVision/app/src/main/java/com/fantest/pokervision/MainActivity.kt

      - name: Unit tests
        working-directory: PokerVision
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: PokerVision
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          set -euo pipefail
          cp PokerVision/app/build/outputs/apk/debug/app-debug.apk Poker-Vision-v0.2.0.apk
          test "$(stat -c%s Poker-Vision-v0.2.0.apk)" -gt 100000
          unzip -t Poker-Vision-v0.2.0.apk >/dev/null
          sha256sum Poker-Vision-v0.2.0.apk | tee Poker-Vision-v0.2.0.apk.sha256

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Vision-v0.2.0-apk
          path: |
            Poker-Vision-v0.2.0.apk
            Poker-Vision-v0.2.0.apk.sha256
            Poker-Vision-v0.2.0-source.zip
          if-no-files-found: error
          retention-days: 30
