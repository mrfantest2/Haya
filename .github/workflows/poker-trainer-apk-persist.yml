name: Poker Trainer APK persistent build

on:
  push:
    branches: [poker-trainer-apk-build]
    paths:
      - 'poker-trainer-ci/**'
      - '.github/workflows/poker-trainer-apk-persist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: poker-trainer-ci
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Validate and stage APK
        run: |
          set -euo pipefail
          mkdir -p poker-trainer-dist
          cp poker-trainer-ci/app/build/outputs/apk/debug/app-debug.apk poker-trainer-dist/Poker-Trainer-v0.1.0.apk
          test "$(stat -c%s poker-trainer-dist/Poker-Trainer-v0.1.0.apk)" -gt 10000
          (cd poker-trainer-dist && sha256sum Poker-Trainer-v0.1.0.apk > SHA256SUMS.txt)
          cat poker-trainer-dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Trainer-v0.1.0-apk
          path: poker-trainer-dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Persist APK to build branch
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f poker-trainer-dist/Poker-Trainer-v0.1.0.apk poker-trainer-dist/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build: persist Poker Trainer v0.1.0 APK [skip ci]'
            git push origin HEAD:poker-trainer-apk-build
          fi
