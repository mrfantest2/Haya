name: Build and validate v3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify authoritative source archive
        run: |
          sha256sum -c source-v3/SHA256.txt
          rm -rf .v3src
          mkdir .v3src
          unzip -q source-v3/Haya_Job_Autopilot_v3.0.0_Source.zip -d .v3src
      - name: Validate profile JSON
        working-directory: .v3src
        run: |
          python - <<'PY'
          import json
          for p in ['config/haya_profile.json','config/private_answers.template.json','manager/resources/haya_profile.json']:
              with open(p, encoding='utf-8') as f: json.load(f)
              print('PASS', p)
          PY
      - name: Validate embedded CV
        working-directory: .v3src
        run: |
          test -s manager/resources/Haya_Saadeh_CV.pdf
          head -c 4 manager/resources/Haya_Saadeh_CV.pdf | grep -q '%PDF'
      - name: Regression guards
        working-directory: .v3src
        run: |
          grep -q 'CompareAndSwap(false, true)' manager/main.go
          grep -q 'HayaJobAutopilotManagerV3' manager/main.go
          grep -q 'HayaJobAutopilotAgentV3' manager/agent.go
          grep -q 'CryptProtectData' manager/windows.go
          ! grep -q 'docker.exe' manager/*.go
          ! grep -q 'wsl.exe' manager/*.go
          ! grep -q 'runas' manager/*.go
      - name: Vet Windows source
        working-directory: .v3src
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go vet -unsafeptr=false ./manager
      - name: Build Windows manager
        working-directory: .v3src
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../Haya_Job_Autopilot_Manager_v3.0.0.exe ./manager
          sha256sum ../Haya_Job_Autopilot_Manager_v3.0.0.exe > ../SHA256-v3.0.0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Haya-Job-Autopilot-v3.0.0
          path: |
            Haya_Job_Autopilot_Manager_v3.0.0.exe
            SHA256-v3.0.0.txt
          if-no-files-found: error
