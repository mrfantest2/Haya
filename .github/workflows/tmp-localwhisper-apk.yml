name: Temporary LocalWhisper APK Build

on:
  push:
    branches:
      - tmp/localwhisper-apk-build
    paths:
      - localwhisper-build.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Verify staged source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/localwhisper-src/LocalWhisper"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/cpp/native-lib.cpp"
          test -f "$PROJECT/app/src/main/java/win/fantest/localwhisper/MainActivity.java"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Pin NDK for hosted build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT']) / 'app/build.gradle.kts'
          s = p.read_text()
          needle = '    compileSdk = 35\n'
          assert needle in s
          if 'ndkVersion = ' not in s:
              s = s.replace(needle, needle + '    ndkVersion = "27.2.12479018"\n', 1)
          p.write_text(s)
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p artifacts
          cp "$APK" artifacts/LocalWhisper-v0.1.0-debug.apk
          sha256sum artifacts/LocalWhisper-v0.1.0-debug.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts/LocalWhisper-v0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalWhisper-v0.1.0-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
