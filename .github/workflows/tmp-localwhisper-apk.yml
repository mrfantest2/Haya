name: Temporary LocalWhisper APK Build

on:
  push:
    branches:
      - tmp/localwhisper-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          for f in localwhisper/payload.part01.b64 localwhisper/payload.part02.b64 localwhisper/payload.part03.b64 localwhisper/payload.part04.b64; do
            printf '%s bytes=' "$f"
            wc -c < "$f"
            python3 - "$f" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          bad = sorted(set(re.sub(r'[A-Za-z0-9+/=\r\n\t ]', '', s)))
          clean = re.sub(r'\s+', '', s)
          print('clean_len=', len(clean), 'mod4=', len(clean) % 4, 'bad=', bad)
          PY
          done
          cat localwhisper/payload.part01.b64 \
              localwhisper/payload.part02.b64 \
              localwhisper/payload.part03.b64 \
              localwhisper/payload.part04.b64 | tr -d '\r\n\t ' > /tmp/localwhisper.b64
          base64 --decode /tmp/localwhisper.b64 > /tmp/LocalWhisper-source.zip
          echo '02fa3dc3e1dba8a754e3156da74c388e38f73903c41c1e6796ac24c26bdd56eb  /tmp/LocalWhisper-source.zip' | sha256sum -c -
          mkdir -p /tmp/localwhisper-src
          unzip -q /tmp/LocalWhisper-source.zip -d /tmp/localwhisper-src
          test -f /tmp/localwhisper-src/LocalWhisper/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'

      - name: Pin NDK for hosted build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/localwhisper-src/LocalWhisper/app/build.gradle.kts')
          s = p.read_text()
          needle = '    compileSdk = 35\n'
          assert needle in s
          s = s.replace(needle, needle + '    ndkVersion = "27.2.12479018"\n', 1)
          p.write_text(s)
          PY

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build arm64 debug APK
        working-directory: /tmp/localwhisper-src/LocalWhisper
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/localwhisper-src/LocalWhisper/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p artifacts
          cp "$APK" artifacts/LocalWhisper-v0.1.0-debug.apk
          sha256sum artifacts/LocalWhisper-v0.1.0-debug.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts/LocalWhisper-v0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalWhisper-v0.1.0-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
