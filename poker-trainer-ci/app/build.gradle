plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fantest.pokervision'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fantest.pokervision'
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName '0.3.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        qa {
            // Public/non-production signer used only with the .qa applicationId suffix.
            storeFile file('../qa/poker-vision-qa.jks')
            storePassword 'PokerVisionQA2026'
            keyAlias 'poker-vision-qa'
            keyPassword 'PokerVisionQA2026'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            signingConfig signingConfigs.qa
            manifestPlaceholders = [appLabel: 'Poker Vision QA']
        }
        release {
            // Production remains com.fantest.pokervision and must use the private
            // Google Play/upload key rather than the public QA signer above.
            manifestPlaceholders = [appLabel: 'Poker Vision']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'

    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'org.opencv:opencv:4.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
